services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-postgres
    environment:
      POSTGRES_USER: ai
      POSTGRES_PASSWORD: aishop123
      POSTGRES_DB: ai_shop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai -d ai_shop"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ai-network

  mysql:
    image: mysql:8.0
    container_name: ai-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_USER: ai
      MYSQL_PASSWORD: aishop123
      MYSQL_DATABASE: ai_orders
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ai-network

  backend:
    build: ./backend
    container_name: ai-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - POSTGRES_URL=postgresql://ai:aishop123@postgres:5432/ai_shop
      - MYSQL_URL=mysql+pymysql://ai:aishop123@mysql:3306/ai_orders
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
    command: >
      sh -c "cd /app && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    networks:
      - ai-network

  frontend:
    build: ./frontend
    container_name: ai-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - ai-network

volumes:
  postgres_data:
  mysql_data:

networks:
  ai-network:
    driver: bridge